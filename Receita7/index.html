<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <title>Receita 7</title>
   <style>
      body {
         font-family: Arial, sans-serif;
         padding: 20px;
         background-color: #f4f4f9;
      }

      button {
         padding: 10px 20px;
         background-color: #28a745;
         color: white;
         border: none;
         border-radius: 4px;
         cursor: pointer;
         font-size: 16px;
         margin-bottom: 20px;
      }

      button:hover {
         background-color: #218838;
      }

      .tabela-generica {
         border-collapse: collapse;
         width: 100%;
         max-width: 800px;
         background: white;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         border-radius: 6px;
         overflow: hidden;
      }

      .tabela-generica th, 
      .tabela-generica td {
         border: 1px solid #ddd;
         padding: 12px 15px;
         text-align: left;
      }

      .tabela-generica th {
         background-color: #28a745;
         color: white;
         text-transform: uppercase;
         font-size: 14px;
      }

      .tabela-generica tr:nth-child(even) {
         background-color: #f9f9f9;
      }

      .tabela-generica tr:hover {
         background-color: #f1f1f1;
      }
   </style>
</head>

<body>
   <div><button id="botaoCarregar">Carregar Usuários</button></div>
   <div id="resultadoDiv"></div>            
   
   <!-- O 'type="module"' é obrigatório para conseguir importar arquivos JS externos -->
   <script type="module">
      import { criarTabela } from './tabela.js'

      let dadosApi = []

      const carregarDados = async () => {
         try {
            let res = await fetch("https://random-data-api.com/api/v2/users?size=5")
            dadosApi = await res.json()
            
            criarTabela(
               dadosApi, 
               ["Nome", "Sobrenome", "Username", "E-mail", "Cidade"], 
               ["first_name", "last_name", "username", "email", "city"], 
               "resultadoDiv"
            )
         } catch (err) {
            document.getElementById("resultadoDiv").innerHTML = "<p style='color: red;'>Erro ao carregar dados da API.</p>"
         }
      }

      let botao = document.getElementById("botaoCarregar")
      botao.addEventListener("click", carregarDados)
   </script>
</body>
</html>
